<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Zombie appearance comparison</title>
<style>body{margin:0;background:#20262c;color:white;font:18px system-ui}canvas{width:100vw;height:100vh;display:block}header{position:absolute;top:20px;left:0;width:100%;text-align:center}footer{position:absolute;bottom:22px;width:100%;display:flex;justify-content:space-around}small{display:block;color:#c5d0d5}</style>
<canvas id="view"></canvas><header>Same clothing, clearly different infection state<small>Human / zombie pairs • civilian and police • actual game meshes and materials</small></header>
<footer><span>Civilian → Zombie</span><span>Police → Infected police</span></footer>
<script type="module">
import * as pc from 'playcanvas';
import {createCharacterVisuals} from './src/character-visuals.js';
import {QUALITY_PROFILES} from './src/quality-profiles.js';
const app=new pc.Application(document.querySelector('canvas'),{});app.setCanvasFillMode(pc.FILLMODE_FILL_WINDOW);app.setCanvasResolution(pc.RESOLUTION_AUTO);app.scene.ambientLight=new pc.Color(.55,.55,.55);
window.addEventListener('resize',()=>app.resizeCanvas());
const material=(r,g,b)=>{const m=new pc.StandardMaterial();m.diffuse=new pc.Color(r,g,b);m.gloss=.06;m.update();return m;};
const mats={black:material(.03,.03,.03),axe:material(.3,.2,.1),gun:material(.06,.06,.06),zombie:material(.26,.72,.24),police:material(.08,.13,.28),fire:material(.56,.08,.05),yellow:material(.82,.68,.1)};
const factory=createCharacterVisuals(pc,app,mats,[material(.18,.26,.34)],a=>a[0]),actors=[];
for(const [i,role] of ['civilian','civilian','police','police'].entries()){
const entity=factory.create(role,'adult','m',material(.8,.6,.4));app.root.addChild(entity);entity.setPosition((i-1.5)*1.45,0,0);entity.setEulerAngles(0,165,0);
actors.push({id:i,entity,type:i%2?'zombie':role,walkDistance:0,state:'wander',lastScream:-99,lastVisualAttack:-99,weapon:null});}
const camera=new pc.Entity('Camera');camera.addComponent('camera',{clearColor:new pc.Color(.12,.15,.18),fov:40});app.root.addChild(camera);camera.setPosition(0,2.1,8.5);camera.lookAt(0,.95,0);
const light=new pc.Entity('Light');light.addComponent('light',{type:'directional',color:new pc.Color(1,.96,.86),intensity:1.4});light.setEulerAngles(35,25,0);app.root.addChild(light);
let now=0;app.on('update',dt=>{now+=dt;for(const actor of actors)factory.update(actor,dt,now,camera.getPosition(),QUALITY_PROFILES.high);});app.start();
</script></html>
